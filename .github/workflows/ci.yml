name: CI

on:
  push:
    branches: ["main"]
  pull_request:

defaults:
  run:
    working-directory: ./Joya-Backend

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: Joya-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Build Docker image (validation)
        run: docker build -t joya-app:ci -f Dockerfile .
